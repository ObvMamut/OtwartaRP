<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>otwarta dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f0f2f5; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    #log-console {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      height: 300px;
      overflow-y: auto;
      padding: 0.75rem;
      border-radius: 0.375rem;
      line-height: 1.5;
    }
    .progress { height: 6px; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4 px-3">
  <span class="navbar-brand fw-bold">otwarta research tool</span>
  <span class="badge bg-secondary fs-6" id="task-badge">● idle</span>
</nav>

<div class="container-fluid px-4">

  <!-- Row 1 -->
  <div class="row g-3 mb-3">

    <!-- Status -->
    <div class="col-md-3">
      <div class="card h-100">
        <div class="card-header fw-semibold">Status</div>
        <div class="card-body">
          <p class="mb-1 small">Articles scraped: <strong id="scraped">—</strong></p>
          <p class="mb-2 small">Analyzed: <strong id="analyzed">—</strong> (<span id="pct">—</span>%)</p>
          <div class="progress">
            <div class="progress-bar bg-success" id="progress-bar" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- DB -->
    <div class="col-md-2">
      <div class="card h-100">
        <div class="card-header fw-semibold">Database</div>
        <div class="card-body d-flex align-items-center">
          <button class="btn btn-sm btn-outline-secondary w-100 action-btn" onclick="dbInit()">
            Initialize DB
          </button>
        </div>
      </div>
    </div>

    <!-- Scrape -->
    <div class="col-md-3">
      <div class="card h-100">
        <div class="card-header fw-semibold">Scrape</div>
        <div class="card-body">
          <select class="form-select form-select-sm mb-2" id="scrape-site">
            <option value="dorzeczy">dorzeczy.pl</option>
            <option value="pch24">pch24.pl</option>
          </select>
          <div class="row g-1 mb-2">
            <div class="col-6">
              <input type="date" class="form-control form-control-sm" id="scrape-start" value="2022-10-07">
            </div>
            <div class="col-6">
              <input type="date" class="form-control form-control-sm" id="scrape-end" value="2024-10-07">
            </div>
          </div>
          <button class="btn btn-sm btn-primary w-100 action-btn" onclick="startScrape()">
            Start Scraping
          </button>
        </div>
      </div>
    </div>

    <!-- Analyze -->
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-header fw-semibold">Analyze</div>
        <div class="card-body">
          <label class="form-label small mb-1">
            Workers: <strong id="workers-val">8</strong>
          </label>
          <input type="range" class="form-range mb-2" id="workers" min="1" max="16" value="8"
                 oninput="document.getElementById('workers-val').textContent=this.value">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="resume" checked>
            <label class="form-check-label small" for="resume">Resume (skip already analyzed)</label>
          </div>
          <button class="btn btn-sm btn-success w-100 action-btn" onclick="startAnalyze()">
            Start Analysis
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Row 2: Visualize -->
  <div class="row g-3 mb-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header fw-semibold">Visualize</div>
        <div class="card-body row g-2 align-items-end">
          <div class="col-5">
            <label class="form-label small mb-1">Output directory</label>
            <input type="text" class="form-control form-control-sm" id="viz-output" value="data/processed">
          </div>
          <div class="col-3">
            <label class="form-label small mb-1">Cutoff date</label>
            <input type="date" class="form-control form-control-sm" id="viz-cutoff" value="2023-10-07">
          </div>
          <div class="col-4">
            <button class="btn btn-sm btn-warning w-100 action-btn" onclick="startVisualize()">
              Generate Charts
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Logs -->
  <div class="row g-3">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong class="small text-muted text-uppercase">Live Logs</strong>
        <button class="btn btn-sm btn-outline-secondary" onclick="clearLogs()">Clear</button>
      </div>
      <div id="log-console"></div>
    </div>
  </div>

</div><!-- /container -->

<script>
  // ── Helpers ──────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const api = (path, opts) =>
    fetch(path, opts).then(r => r.ok ? r.json() : Promise.reject(r.statusText));

  // ── Status polling (every 5 s) ────────────────────────────────────────────
  async function refreshStatus() {
    try {
      const d = await api('/api/status');
      $('scraped').textContent = d.articles_scraped;
      $('analyzed').textContent = d.articles_analyzed;
      $('pct').textContent = d.percent;
      $('progress-bar').style.width = d.percent + '%';
    } catch (_) {}
  }

  async function refreshTask() {
    try {
      const d = await api('/api/task');
      const running = d.status === 'running';
      const badge = $('task-badge');
      badge.textContent = running ? `● ${d.name}` : `● ${d.status}`;
      badge.className = 'badge fs-6 ' + (
        running          ? 'bg-warning text-dark' :
        d.status==='error'  ? 'bg-danger'           :
        d.status==='done'   ? 'bg-success'           : 'bg-secondary'
      );
      document.querySelectorAll('.action-btn').forEach(b => b.disabled = running);
    } catch (_) {}
  }

  setInterval(() => { refreshStatus(); refreshTask(); }, 5000);
  refreshStatus();
  refreshTask();

  // ── Actions ───────────────────────────────────────────────────────────────
  async function dbInit() {
    await api('/api/db/init', { method: 'POST' });
    log('[dashboard] Database initialized');
    refreshStatus();
  }

  async function startScrape() {
    const body = {
      site:  $('scrape-site').value,
      start: $('scrape-start').value,
      end:   $('scrape-end').value,
    };
    try {
      await api('/api/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      refreshTask();
    } catch (e) { log(`[error] ${e}`); }
  }

  async function startAnalyze() {
    const body = {
      workers: parseInt($('workers').value),
      resume:  $('resume').checked,
    };
    try {
      await api('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      refreshTask();
    } catch (e) { log(`[error] ${e}`); }
  }

  async function startVisualize() {
    const body = {
      output: $('viz-output').value,
      cutoff: $('viz-cutoff').value,
    };
    try {
      await api('/api/visualize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      refreshTask();
    } catch (e) { log(`[error] ${e}`); }
  }

  // ── Log console ───────────────────────────────────────────────────────────
  const logEl = $('log-console');

  function log(msg) {
    const div = document.createElement('div');
    div.textContent = msg;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function clearLogs() { logEl.innerHTML = ''; }

  const evtSource = new EventSource('/api/logs');
  evtSource.onmessage = e => { if (e.data) log(e.data); };
  evtSource.onerror   = () => log('[connection lost — reload to reconnect]');
</script>
</body>
</html>
